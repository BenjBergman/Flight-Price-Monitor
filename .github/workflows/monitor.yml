name: Check flight prices

on:
  schedule:
    - cron: "20 5 * * *"   # every day 05:20 UTC = 08:20 Helsinki summer time / 07:20 winter
  workflow_dispatch:        # "Run workflow" button for a manual check

permissions:
  contents: write

concurrency:
  group: flight-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check prices and send email if suitable
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python monitor.py

      - name: Save price history and dashboard
        run: |
          git config user.name "flight-monitor-bot"
          git config user.email "flight-monitor-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Price check $(date -u +%F)"
          git push
